openapi: 3.0.3
info:
  title: TaskFlow API
  version: 1.0.0
  description: API projektu warsztatowego TaskFlow.
servers:
  - url: http://localhost:8080
paths:
  /api/tasks:
    get:
      summary: Pobierz zadania
      operationId: listTasks
      parameters:
        - name: status
          in: query
          required: false
          description: Opcjonalny filtr statusu.
          schema:
            $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: Lista zadań.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Utwórz zadanie
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
            example:
              title: Przygotować demo
              description: Wersja na piątek
      responses:
        '201':
          description: Utworzone zadanie.
          headers:
            Location:
              description: Ścieżka utworzonego zadania.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    put:
      summary: Zmień treść zadania
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
            example:
              title: Nowy tytuł
              description: Nowy opis
      responses:
        '200':
          description: Zmienione zadanie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Nie znaleziono zadania.
    delete:
      summary: Usuń zadanie
      operationId: deleteTask
      responses:
        '204':
          description: Zadanie usunięte.
        '404':
          description: Nie znaleziono zadania.
  /api/tasks/{id}/status:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      summary: Zmień status zadania
      operationId: changeTaskStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/TaskStatus'
            example:
              status: IN_PROGRESS
      responses:
        '200':
          description: Zadanie ze zmienionym statusem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Brak statusu lub nieprawidłowa wartość.
        '404':
          description: Nie znaleziono zadania.
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Identyfikator istniejącego zadania.
      schema:
        type: integer
        format: int64
      example: 1
  schemas:
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
